[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Agentic trading bot exposing a 5-layer toolkit to Claude over MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
live = ["robin_stocks>=3.0.0"]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
